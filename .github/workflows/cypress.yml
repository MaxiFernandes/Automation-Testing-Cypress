name: Cypress Regression Tests
run-name: 🚀 Cypress Tests in ${{ github.ref_name }} by @${{ github.actor }} 👨🏻‍🔬

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  cypress-run:
    name: 🧪 Cypress E2E Regression Suite
    runs-on: ubuntu-latest

    env:
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

    steps:
      - name: 💻 Checkout Repository
        uses: actions/checkout@v4

      - name: 💿 Setup Node.js & Cache npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🌲 Cypress Run
        uses: cypress-io/github-action@v6
        with:
          command: npm run regression
          browser: chrome

      - name: 📊 Upload Test Evidence & Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-execution-evidence
          path: |
            cypress/screenshots/
            cypress/videos/
            cypress/reports/
          retention-days: 7